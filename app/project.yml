name: Sublate
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  SublateKit:
    path: Kit
targets:
  Sublate:
    type: application
    platform: macOS
    sources:
      - Sublate
      # yt-dlp, deno and ffmpeg, already signed by `make tools`; copied as-is to Resources/tools.
      - path: ../vendor/tools
        type: folder
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
    dependencies:
      - package: SublateKit
        product: SublateUI
    settings:
      base:
        PRODUCT_NAME: Sublate
        PRODUCT_MODULE_NAME: Sublate
        PRODUCT_BUNDLE_IDENTIFIER: tech.radiw.sublate
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sublate/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 YingPing Lin. Licensed under GPL-3.0-or-later.
        # Not sandboxed: the backend runs the bundled tools and writes wherever the user chooses.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 5Q458ND242
        CODE_SIGN_IDENTITY: Developer ID Application
        ENABLE_HARDENED_RUNTIME: YES
        # Notarization needs a secure timestamp and rejects the debugging entitlement.
        OTHER_CODE_SIGN_FLAGS: --timestamp
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
