<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sublate</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2E37"/>
      <stop offset="1" stop-color="#101115"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8CB6B"/>
      <stop offset="1" stop-color="#F5B731"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E879C"/>
      <stop offset="1" stop-color="#5E677B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 pt rounded square centred on the 1024 pt canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Translated line, lifted above the source line's fragments -->
  <rect x="281" y="355" width="462" height="115" rx="57.5" fill="url(#target)"/>
  <rect x="281" y="553" width="241" height="115" rx="57.5" fill="url(#source)"/>
  <rect x="570" y="553" width="173" height="115" rx="57.5" fill="url(#source)"/>
</svg>
