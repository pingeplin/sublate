[package]
name = "sublate-core"
version = "0.1.0"
description = "Fetch videos and translate subtitles"
authors = ["eplin"]
edition = "2021"

[lib]
crate-type = ["lib", "staticlib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen-swift"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["fs", "process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
futures = "0.3.34"
unicode-normalization = "0.1.25"
uniffi = { version = "0.32.2", features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
