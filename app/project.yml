name: Sublate
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  SublateKit:
    path: Kit
targets:
  Sublate:
    type: application
    platform: macOS
    sources:
      - Sublate
    dependencies:
      - package: SublateKit
        product: SublateUI
    settings:
      base:
        PRODUCT_NAME: Sublate
        PRODUCT_MODULE_NAME: Sublate
        PRODUCT_BUNDLE_IDENTIFIER: tech.radiw.sublate
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sublate/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Not sandboxed: the backend runs yt-dlp, ffmpeg and ant from the login-shell PATH.
        CODE_SIGN_IDENTITY: "-"
